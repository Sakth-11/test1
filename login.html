<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveWise AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Fleur+De+Leah&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palette */
      --blue: #2d00f7;
      --electric-indigo: #6a00f4;
      --ultra-violet: #8900f2;
      --purple-1: #a100f2;
      --purple-2: #b100e8;
      --hyper-magenta: #bc00dd;
      --vivid-orchid-1: #d100d1;
      --vivid-orchid-2: #db00b6;
      --electric-rose: #e500a4;
      --barbie-pink: #f20089;

      --bg-main: #f7f0ff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(137, 0, 242, 0.25);
      --text-main: #1a0070;
      --text-muted: #6a00f4;
      --input-bg: rgba(161, 0, 242, 0.06);
      --input-border: rgba(177, 0, 232, 0.3);
      --accent: #8900f2;
      --gradient-btn: linear-gradient(135deg, #2d00f7, #8900f2 45%, #f20089);
      --gradient-title: linear-gradient(90deg, #2d00f7, #8900f2 40%, #d100d1 70%, #f20089);
      --shadow: 0 20px 40px rgba(137, 0, 242, 0.2);
      --error-color: #f20089;

      --font-title: 'Fleur De Leah', cursive;
      --font-sub: 'Cookie', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ANIMATED GRADIENT BACKGROUND */
    body {
      min-height: 100vh;
      background: linear-gradient(120deg, #f7f0ff, #ece0ff, #ffe3f3, #e6e1ff, #f7f0ff);
      background-size: 300% 300%;
      animation: gradientShift 16s ease infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Ambient Glowing Background Orbs */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 8s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: rgba(45, 0, 247, 0.28);
      top: -50px;
      left: -50px;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: rgba(242, 0, 137, 0.25);
      bottom: -60px;
      right: -60px;
      animation-delay: -4s;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(1.2) translate(20px, 20px); opacity: 0.9; }
    }

    /* Floating Wealth Symbols */
    .wealth-bg-symbols {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .wealth-symbol {
      position: absolute;
      font-size: 2.2rem;
      animation: floatUp 12s infinite linear;
      opacity: 0.6;
    }

    .wealth-symbol:nth-child(1) { left: 12%; animation-duration: 9s; animation-delay: 0s; }
    .wealth-symbol:nth-child(2) { left: 32%; animation-duration: 13s; animation-delay: 2s; }
    .wealth-symbol:nth-child(3) { left: 55%; animation-duration: 10s; animation-delay: 1s; }
    .wealth-symbol:nth-child(4) { left: 75%; animation-duration: 14s; animation-delay: 4s; }
    .wealth-symbol:nth-child(5) { left: 90%; animation-duration: 11s; animation-delay: 3s; }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    /* FLOATING TRANSACTION CARDS */
    .txn-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .txn-card {
      position: absolute;
      bottom: -90px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 10px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(137, 0, 242, 0.15);
      white-space: nowrap;
      opacity: 0;
      transition: none;
      animation: txnRise var(--dur) linear var(--delay) infinite;
    }

    .txn-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      color: #fff;
      transition: none;
    }

    .txn-card.credit .txn-icon { background: linear-gradient(135deg, #2d00f7, #8900f2); }
    .txn-card.debit  .txn-icon { background: linear-gradient(135deg, #db00b6, #f20089); }

    .txn-info { display: flex; flex-direction: column; line-height: 1.2; transition: none; }
    .txn-title { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; transition: none; }
    .txn-amount { font-size: 0.9rem; font-weight: 700; transition: none; }
    .txn-card.credit .txn-amount { color: var(--blue); }
    .txn-card.debit  .txn-amount { color: var(--barbie-pink); }

    @keyframes txnRise {
      0%   { transform: translateY(0) rotate(var(--rot)); opacity: 0; }
      10%  { opacity: 0.95; }
      85%  { opacity: 0.95; }
      100% { transform: translateY(-120vh) rotate(calc(var(--rot) * -1)); opacity: 0; }
    }

    /* ANIMATED SAVINGS SPARKLINE */
    .sparkline {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 34%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
    }

    .spark-line {
      fill: none;
      stroke: url(#sparkGrad);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: drawLine 7s ease-in-out infinite;
    }

    .spark-area {
      fill: url(#areaGrad);
      opacity: 0;
      animation: fadeArea 7s ease-in-out infinite;
    }

    @keyframes drawLine {
      0%   { stroke-dashoffset: 2000; }
      60%  { stroke-dashoffset: 0; }
      90%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes fadeArea {
      0%, 30% { opacity: 0; }
      60%, 90% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, .glow-orb, .wealth-symbol, .auth-card, .txn-card, .spark-line, .spark-area { animation: none; }
      .txn-layer { display: none; }
      .spark-line { stroke-dashoffset: 0; }
    }

    /* Container Card */
    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: var(--gradient-btn);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 8px 20px rgba(137, 0, 242, 0.35);
      flex-shrink: 0;
    }

    /* Title – Fleur De Leah */
    .brand-title h1 {
      font-family: var(--font-title);
      font-size: 3rem;
      font-weight: 400;
      line-height: 1;
      background: var(--gradient-title);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      padding: 4px 6px 2px 0;
    }

    /* Sub title – Cookie */
    .brand-title p {
      font-family: var(--font-sub);
      font-size: 1.5rem;
      line-height: 1.1;
      color: var(--electric-rose);
    }

    .form-title {
      font-family: var(--font-sub);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 22px;
      text-align: center;
      color: var(--electric-indigo);
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 16px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-group label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.88rem;
      pointer-events: none;
      transition: 0.25s ease all;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: 0;
      font-size: 0.75rem;
      padding: 2px 8px;
      background: #fbf7ff;
      border-radius: 6px;
      color: var(--hyper-magenta);
    }

    .input-group input:focus {
      border-color: var(--purple-2);
      box-shadow: 0 0 0 4px rgba(177, 0, 232, 0.18);
    }

    .error-text {
      font-size: 0.78rem;
      color: var(--error-color);
      margin-top: 6px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-btn);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 25px rgba(137, 0, 242, 0.4);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(242, 0, 137, 0.45);
    }

    .submit-btn:focus-visible {
      outline: 3px solid var(--barbie-pink);
      outline-offset: 3px;
    }

    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--electric-rose);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* Popup Modal */
    .mascot-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(26, 0, 112, 0.5);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .mascot-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mascot-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: var(--shadow);
    }

    .mascot-card h3 {
      font-family: var(--font-sub);
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--electric-rose);
    }

    .mascot-avatar {
      font-size: 4rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- Ambient Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Animated savings graph -->
  <svg class="sparkline" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2d00f7"/>
        <stop offset="50%" stop-color="#bc00dd"/>
        <stop offset="100%" stop-color="#f20089"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8900f2" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#8900f2" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path class="spark-area" d="M0,170 L100,150 L200,160 L320,115 L430,130 L540,85 L650,100 L760,60 L880,75 L990,35 L1100,50 L1200,15 L1200,200 L0,200 Z"/>
    <path class="spark-line" d="M0,170 L100,150 L200,160 L320,115 L430,130 L540,85 L650,100 L760,60 L880,75 L990,35 L1100,50 L1200,15"/>
  </svg>

  <!-- Floating Wealth Symbols -->
  <div class="wealth-bg-symbols">
    <div class="wealth-symbol">🪙</div>
    <div class="wealth-symbol">💵</div>
    <div class="wealth-symbol">📊</div>
    <div class="wealth-symbol">💰</div>
    <div class="wealth-symbol">💳</div>
  </div>

  <!-- Floating Transaction Cards (filled by JS) -->
  <div class="txn-layer" id="txnLayer" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="card-header">
      <div class="brand">
        <div class="brand-icon">🛡️</div>
        <div class="brand-title">
          <h1>SaveWise AI</h1>
          <p>Smart Savings Companion</p>
        </div>
      </div>
    </div>

    <!-- LOGIN FORM -->
    <h2 class="form-title">Welcome Back!</h2>
    <form onsubmit="handleLogin(event)">
      <div class="input-group">
        <input type="email" id="loginEmail" placeholder=" " required />
        <label for="loginEmail">Email Address</label>
      </div>

      <div class="input-group">
        <input type="password" id="loginPass" placeholder=" " required />
        <label for="loginPass">Password</label>
        <span class="error-text" id="loginError">Invalid Email or Password!</span>
      </div>

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <div class="card-footer">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>

  <!-- Success Popup Modal -->
  <div class="mascot-modal-overlay" id="successModal">
    <div class="mascot-card">
      <div class="mascot-avatar">💵🪙</div>
      <h3>Welcome Back!</h3>
      <p id="welcomeMsg">Opening your Dashboard...</p>
    </div>
  </div>

  <script>
    /* ---------- Floating transaction cards ---------- */
    (function buildTransactions() {
      const layer = document.getElementById('txnLayer');
      const txns = [
        { icon: '💼', title: 'Salary Credited',  amount: '+₹50,000', type: 'credit' },
        { icon: '🍔', title: 'Swiggy',           amount: '-₹320',    type: 'debit'  },
        { icon: '🏦', title: 'Savings Deposit',  amount: '+₹5,000',  type: 'credit' },
        { icon: '🛒', title: 'Grocery',          amount: '-₹1,450',  type: 'debit'  },
        { icon: '📈', title: 'Mutual Fund SIP',  amount: '-₹2,000',  type: 'debit'  },
        { icon: '🎁', title: 'Cashback',         amount: '+₹150',    type: 'credit' },
        { icon: '⚡', title: 'EB Bill',          amount: '-₹890',    type: 'debit'  },
        { icon: '☕', title: 'Coffee',           amount: '-₹120',    type: 'debit'  },
        { icon: '💸', title: 'Freelance Income', amount: '+₹12,500', type: 'credit' },
        { icon: '🚕', title: 'Cab Ride',         amount: '-₹260',    type: 'debit'  }
      ];

      txns.forEach((t, i) => {
        const dur = 14 + Math.random() * 8;                 // 14s - 22s
        const el = document.createElement('div');
        el.className = 'txn-card ' + t.type;
        el.style.left = (4 + (i * 9.2) % 82) + '%';         // spread across width
        el.style.setProperty('--dur', dur + 's');
        el.style.setProperty('--delay', (-Math.random() * dur) + 's');
        el.style.setProperty('--rot', (Math.random() * 8 - 4) + 'deg');
        el.innerHTML =
          '<div class="txn-icon">' + t.icon + '</div>' +
          '<div class="txn-info">' +
            '<span class="txn-title">' + t.title + '</span>' +
            '<span class="txn-amount">' + t.amount + '</span>' +
          '</div>';
        layer.appendChild(el);
      });
    })();

    /* ---------- Login logic ---------- */
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const registeredEmail = urlParams.get('registeredEmail');
      if (registeredEmail) {
        document.getElementById('loginEmail').value = registeredEmail;
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value;
      const loginError = document.getElementById('loginError');

      loginError.style.display = 'none';

      // 1. Fetch multi-user registered list
      const usersList = JSON.parse(localStorage.getItem('savewise_users_list')) || [];
      const legacyKey = `savewise_user_${email}`;
      const legacyUserJson = localStorage.getItem(legacyKey);
      let foundUser = usersList.find(u => u.email === email);

      if (!foundUser && legacyUserJson) {
        const legacyUser = JSON.parse(legacyUserJson);
        foundUser = { name: legacyUser.name, email: legacyUser.email, password: legacyUser.pass || legacyUser.password };
      }

      if (!foundUser) {
        loginError.innerText = "No account found with this email! Please Register.";
        loginError.style.display = 'block';
        return;
      }

      const userPass = foundUser.password || foundUser.pass;
      if (userPass !== pass) {
        loginError.innerText = "Incorrect Password! Please try again.";
        loginError.style.display = 'block';
        return;
      }

      // 2. Set active session email
      localStorage.setItem('savewise_current_user', email);

      // 3. Ensure this specific user has isolated storage container
      const userScopedKey = `savewise_userData_${email}`;
      if (!localStorage.getItem(userScopedKey)) {
        const freshUserData = {
          profile: { name: foundUser.name, email: email, baseIncome: 0, currency: '₹' },
          budget: [],
          transactions: [],
          goals: []
        };
        localStorage.setItem(userScopedKey, JSON.stringify(freshUserData));
      }

      document.getElementById('welcomeMsg').innerText = `Welcome back, ${foundUser.name}! Opening Dashboard...`;
      document.getElementById('successModal').classList.add('active');

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }
  </script>
</body>
</html>
